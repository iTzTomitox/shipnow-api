paths:
  /api/products:
    get:
      tags: [Products]
      summary: Listar productos
      description: Por defecto devuelve solo los productos disponibles (stock mayor a 0).
      parameters:
        - name: includeOutOfStock
          in: query
          required: false
          description: Con "true" incluye también los productos sin stock
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: Lista de productos, los más nuevos primero
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      payload:
                        type: array
                        items:
                          $ref: '#/components/schemas/Product'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Products]
      summary: Crear un producto
      description: El status lo calcula el servidor a partir del stock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Producto creado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/Product'
        '400':
          description: Datos inválidos (nombre vacío, precio negativo, stock no entero) o JSON mal formado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  $ref: '#/components/examples/ValidationError'
                INVALID_JSON:
                  $ref: '#/components/examples/InvalidJson'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/products/{pid}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Products]
      summary: Obtener un producto
      responses:
        '200':
          description: Producto encontrado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/Product'
        '404':
          description: El producto no existe (o el id no tiene formato válido)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                PRODUCT_NOT_FOUND:
                  $ref: '#/components/examples/ProductNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags: [Products]
      summary: Actualizar un producto
      description: Actualiza los campos enviados. Si cambia el stock, se recalcula el status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: Producto actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/Product'
        '400':
          description: Datos inválidos o ningún campo válido para actualizar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  $ref: '#/components/examples/ValidationError'
                INVALID_JSON:
                  $ref: '#/components/examples/InvalidJson'
        '404':
          description: El producto no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                PRODUCT_NOT_FOUND:
                  $ref: '#/components/examples/ProductNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Products]
      summary: Eliminar un producto
      responses:
        '200':
          description: Producto eliminado (devuelve el producto borrado)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/Product'
        '404':
          description: El producto no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                PRODUCT_NOT_FOUND:
                  $ref: '#/components/examples/ProductNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
